<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- REST (unselected) state. Same tone-matched tile as the active SVG;
       only the glyph is dimmer so the icon reads as "idle, not engaged". -->
  <rect x="0" y="0" width="32" height="32" fill="#2a2a2a"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#bbbbbb" stroke-width="1.6"/>
  <g fill="#bbbbbb">
    <rect x="9"    y="9"    width="3" height="3" rx="0.5"/>
    <rect x="14.5" y="9"    width="3" height="3" rx="0.5"/>
    <rect x="20"   y="9"    width="3" height="3" rx="0.5"/>
    <rect x="9"    y="14.5" width="3" height="3" rx="0.5"/>
    <rect x="14.5" y="14.5" width="3" height="3" rx="0.5"/>
    <rect x="20"   y="14.5" width="3" height="3" rx="0.5"/>
    <rect x="9"    y="20"   width="3" height="3" rx="0.5"/>
    <rect x="14.5" y="20"   width="3" height="3" rx="0.5"/>
    <rect x="20"   y="20"   width="3" height="3" rx="0.5"/>
  </g>
</svg>
