<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- ACTIVE / rollover state. We paint a rounded-square tile in the same
       tone OpenCPN uses for the toolbar slot (matches what grib_pi /
       dashboard_pi / wmm_pi do; required because Style::BuildPluginIcon in
       OpenCPN gui/src/styles.cpp unconditionally composites every plugin
       SVG onto a GREY2 backing). The tile is then visually invisible
       against the toolbar; the white ring + 3x3 grid sit on top. -->
  <rect x="0" y="0" width="32" height="32" fill="#2a2a2a"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <g fill="#ffffff">
    <rect x="9"    y="9"    width="3" height="3" rx="0.5"/>
    <rect x="14.5" y="9"    width="3" height="3" rx="0.5"/>
    <rect x="20"   y="9"    width="3" height="3" rx="0.5"/>
    <rect x="9"    y="14.5" width="3" height="3" rx="0.5"/>
    <rect x="14.5" y="14.5" width="3" height="3" rx="0.5"/>
    <rect x="20"   y="14.5" width="3" height="3" rx="0.5"/>
    <rect x="9"    y="20"   width="3" height="3" rx="0.5"/>
    <rect x="14.5" y="20"   width="3" height="3" rx="0.5"/>
    <rect x="20"   y="20"   width="3" height="3" rx="0.5"/>
  </g>
</svg>
